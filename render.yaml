services:
  - type: web
    name: saluddata-crm-hospital
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_HOURS
        value: "8"
      - key: EMAIL_DEV_MODE
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
